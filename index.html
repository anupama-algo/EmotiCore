<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="EmotiCore - Emotion-aware adaptive gaming powered by AI."
    >

    <title>EmotiCore</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #f8f7ff;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .splash-screen {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .splash-screen img {
            width: 100%;
            max-width: 1100px;
            height: auto;

            max-height: 100vh;

            object-fit: contain;

            display: block;
        }

    </style>

</head>


<body>

    <main class="splash-screen">

        <img
            src="assets/emoticore-splash.png"
            alt="EmotiCore Splash Screen"
        >

    </main>

</body>

</html>
